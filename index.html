<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FrenchWithLemi | Hub Pédagogique</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --fr-blue: #002395;
      --fr-white: #ffffff;
      --fr-red: #ED2939;
      --accent-yellow: #FFD166;
      --bg-cream: #F8F9FD;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --admin-gold: #D97706;
    }

    /* Strict Anti-Plagiarism Frontend Protections */
    * {
      -webkit-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    /* Auth Gate Modal */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 35, 149, 0.88);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
      border-top: 8px solid var(--fr-red);
    }

    .auth-card h2 {
      font-family: 'Fredoka', sans-serif;
      color: var(--fr-blue);
      margin-bottom: 6px;
    }

    .auth-card input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #E2E8F0;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      margin: 16px 0 10px;
      text-align: center;
      transition: 0.2s ease;
    }

    .auth-card input:focus {
      border-color: var(--fr-blue);
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--fr-blue), #1e40af);
      color: white;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    /* Top Tricolor Banner */
    .tricolor-stripe {
      display: flex;
      height: 6px;
      width: 100%;
    }
    .stripe-blue { background: var(--fr-blue); flex: 1; }
    .stripe-white { background: #E2E8F0; flex: 1; }
    .stripe-red { background: var(--fr-red); flex: 1; }

    /* Header */
    header {
      background: white;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      position: relative;
    }

    .brand-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 2.2rem;
      color: var(--fr-blue);
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title span {
      color: var(--fr-red);
    }

    .subtitle {
      color: #64748B;
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 4px;
    }

    /* Admin Action Toolbar */
    #admin-toolbar {
      display: none;
      background: #FEF3C7;
      border: 2px dashed var(--admin-gold);
      border-radius: 16px;
      max-width: 1100px;
      margin: 20px auto 0;
      padding: 15px 25px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 15px;
    }

    .admin-info {
      font-weight: 700;
      color: #92400E;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-actions {
      display: flex;
      gap: 10px;
    }

    .btn-admin {
      background: var(--admin-gold);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .btn-admin:hover {
      background: #B45309;
    }

    .btn-admin-secondary {
      background: #475569;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Filters */
    .controls-container {
      max-width: 1100px;
      margin: 25px auto 10px;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
    }

    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    .filter-btn {
      border: 2px solid #E2E8F0;
      background: white;
      color: #475569;
      padding: 8px 18px;
      border-radius: 50px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 0.88rem;
    }

    .filter-btn.active {
      background: var(--fr-blue);
      color: white;
      border-color: var(--fr-blue);
      box-shadow: 0 4px 12px rgba(0,35,149,0.25);
    }

    .filter-btn.board-btn.active {
      background: var(--fr-red);
      border-color: var(--fr-red);
      box-shadow: 0 4px 12px rgba(237,41,57,0.25);
    }

    /* Card Grid */
    .grid-container {
      max-width: 1100px;
      margin: 20px auto 60px;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 25px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid #EEF2F6;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }

    .card-preview {
      position: relative;
      background: #0f172a;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card-preview img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      pointer-events: none;
    }

    .embed-wrapper {
      width: 100%;
      height: 220px;
      overflow: hidden;
      background: #FFFFFF;
    }

    .embed-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .badge-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      display: flex;
      gap: 6px;
      z-index: 15;
    }

    .badge {
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
      backdrop-filter: blur(4px);
    }

    .card-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      color: var(--text-dark);
      margin-bottom: 6px;
    }

    .card-desc {
      color: #64748B;
      font-size: 0.88rem;
      line-height: 1.4;
    }

    .watermark-overlay {
      position: absolute;
      inset: 0;
      background: transparent;
      z-index: 10;
    }

    /* Admin Card Controls */
    .admin-card-controls {
      display: none;
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 20;
      gap: 6px;
    }

    .btn-icon {
      background: white;
      border: 1px solid #CBD5E1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #334155;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: 0.2s;
    }

    .btn-icon:hover {
      background: var(--fr-red);
      color: white;
      border-color: var(--fr-red);
    }

    /* Admin Modal (Add/Edit) */
    #admin-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 20000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 20px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h3 {
      font-family: 'Fredoka', sans-serif;
      color: var(--fr-blue);
      font-size: 1.4rem;
    }

    .form-group {
      margin-bottom: 14px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-weight: 700;
      font-size: 0.85rem;
      color: #475569;
      margin-bottom: 5px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #CBD5E1;
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: 'Nunito', sans-serif;
      outline: none;
      -webkit-user-select: auto;
      user-select: auto;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--fr-blue);
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .file-input-wrapper {
      border: 2px dashed #CBD5E1;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      background: #F8FAFC;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    #loader {
      text-align: center;
      grid-column: 1 / -1;
      padding: 40px;
      color: #64748B;
      font-weight: 700;
    }
  </style>
</head>

    <div class="auth-card">
